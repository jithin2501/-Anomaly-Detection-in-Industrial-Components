# Optional. Train the model first (weights must exist), then: docker compose up
services:
  backend:
    image: python:3.11-slim
    working_dir: /app/backend
    volumes: ["./:/app"]
    command: >
      sh -c "apt-get update && apt-get install -y libgl1 libglib2.0-0 &&
             pip install -r /app/ai_engine/requirements.txt -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  frontend:
    image: node:20
    working_dir: /app/frontend
    volumes: ["./frontend:/app/frontend"]
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
